name: zhiliao
services:
  ai:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file: ${SERVER_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4310
      DATABASE_PATH: /app/data/cloud.sqlite
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - cloud-data:/app/data
volumes:
  cloud-data:
